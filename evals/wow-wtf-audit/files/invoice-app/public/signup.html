<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up - Kwit</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell narrow">
    <a class="brand" href="/">Kwit</a>
    <h1>Create your account</h1>
    <p class="form-error" id="form-error" hidden></p>
    <form class="card" id="signup-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <label for="companyName">Company name</label>
      <input id="companyName" name="companyName" type="text" autocomplete="organization" required>
      <label for="taxId">Tax ID</label>
      <input id="taxId" name="taxId" type="text" required>
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" required>
      <button class="button" type="submit">Create account</button>
    </form>
    <p class="muted">Already have an account? <a href="/login">Log in</a></p>
  </main>
  <script type="module" src="/static/signup.js"></script>
</body>
</html>
