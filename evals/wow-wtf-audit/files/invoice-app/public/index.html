<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kwit - Invoices for freelancers</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="app-header shell">
    <a class="brand" href="/">Kwit</a>
    <nav><a href="/login">Log in</a></nav>
  </header>
  <main class="shell">
    <section class="hero">
      <h1>Send an invoice in a minute.</h1>
      <p class="lead">Kwit is invoicing for freelancers. Type in the job, get a link, send it to your client.</p>
      <a class="button" href="/signup">Start free</a>
    </section>
    <section class="card">
      <h2>Free forever</h2>
      <ul class="features">
        <li>VAT worked out for you as you type</li>
        <li>A shareable link for every invoice</li>
        <li>Amounts in PLN, ready for Polish clients</li>
      </ul>
    </section>
  </main>
</body>
</html>
